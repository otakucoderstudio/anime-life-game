      if (S) drawWorld();
      requestAnimationFrame(loop);
    }
    function act() {
      if (!cur || panelOpen) return;
      if (cur.t === "npc") npcMenu(cur.n);
      else cur.f();
    }
    const kd = (e) => {
      keys[e.key] = true;
      if (e.key === "e" || e.key === "E" || e.key === "Enter" || e.key === " ") {
        if (S && !panelOpen) act();
      }
      if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
    };
    const ku = (e) => {
      keys[e.key] = false;
    };
    window.addEventListener("keydown", kd);
    window.addEventListener("keyup", ku);
    cleanup.push(() => {
      window.removeEventListener("keydown", kd);
      window.removeEventListener("keyup", ku);
    });
    const jEl = $("#joy"), kn = $("#knob");
    let jid = null;
    const jm = (e) => {
      const r2 = jEl.getBoundingClientRect();
      let dx = e.clientX - (r2.left + r2.width / 2), dy = e.clientY - (r2.top + r2.height / 2);
      const m = Math.hypot(dx, dy), mx = r2.width / 2 - 10;
      if (m > mx) {
        dx *= mx / m;
        dy *= mx / m;
      }
      joy.x = dx / mx;
      joy.y = dy / mx;
      kn.style.transform = `translate(${dx}px,${dy}px)`;
    };
    jEl.addEventListener("pointerdown", (e) => {
      jid = e.pointerId;
      jEl.setPointerCapture(jid);
      jm(e);
    });
    jEl.addEventListener("pointermove", (e) => {
      if (e.pointerId === jid) jm(e);
    });
    const jend = (e) => {
      if (e.pointerId === jid) {
        jid = null;
        joy.x = joy.y = 0;
        kn.style.transform = "";
      }
    };
    jEl.addEventListener("pointerup", jend);
    jEl.addEventListener("pointercancel", jend);
    $("#act").addEventListener("click", act);
    $("#b1").addEventListener("click", () => {
      if (!panelOpen) menuStatus();
    });
    $("#b2").addEventListener("click", () => {
      if (!panelOpen) menuWardrobe();
    });
    $("#b3").addEventListener("click", () => {
      if (!panelOpen) S.pet ? menuPet() : toast("\u0644\u0633\u0647 \u0645\u0639\u0646\u062F\u0643\u0634 \u062D\u064A\u0648\u0627\u0646\u060C \u0631\u0648\u062D \u0645\u0644\u062C\u0623 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0641\u064A \u0627\u0644\u062D\u062F\u064A\u0642\u0629 \u{1F43E}");
    });
    $("#panel").addEventListener("click", (e) => {
      if (e.target.id === "panel" && $("#sheet").querySelector("button.close")) closePanel();
    });
    function resize() {
      const r2 = box.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(r2.width * d);
      cv.height = Math.round(r2.height * d);
      cx.imageSmoothingEnabled = true;
    }
    const ro = new ResizeObserver(resize);
    ro.observe(box);
    cleanup.push(() => ro.disconnect());
    resize();
    function titleScreen() {
      let gender = "m", nm = "";
      const T = $("#title");
      T.style.backgroundImage = `linear-gradient(rgba(20,10,50,.3),rgba(20,10,50,.8)),url(${BG.park})`;
      const render = () => {
        T.innerHTML = `<h1>\u{1F338} \u062D\u064A\u0627\u0629 \u0623\u0646\u0645\u064A \u{1F338}</h1><div style="font-size:15px;max-width:340px;line-height:1.8;text-shadow:0 2px 4px #000">\u0631\u062D\u0644\u0629 \u062D\u064A\u0627\u0629 \u0641\u064A \u0645\u062F\u064A\u0646\u0629 \u0623\u0646\u0645\u064A: \u0645\u062F\u0631\u0633\u0629\u060C \u0623\u0635\u062D\u0627\u0628\u060C \u0634\u063A\u0644\u060C \u0637\u0628\u062E\u060C \u0648\u062D\u0628 \u2764\uFE0F</div>
   <input id="nm" placeholder="\u0627\u0633\u0645 \u0634\u062E\u0635\u064A\u062A\u0643" maxlength="12" value="${esc(nm)}">
   <div class="row"><button class="card ${gender === "m" ? "on" : ""}" data-g="m"><img src="${PORT.m}" alt="">\u{1F9D1} \u0648\u0644\u062F</button><button class="card ${gender === "f" ? "on" : ""}" data-g="f"><img src="${PORT.f}" alt="">\u{1F467} \u0628\u0646\u062A</button></div>
   <button class="go" id="go">\u0627\u0628\u062F\u0623 \u0627\u0644\u062D\u064A\u0627\u0629 \u25B6</button><div style="font-size:12px;opacity:.9;text-shadow:0 1px 3px #000">\u062A\u062D\u0643\u0645: \u0639\u0635\u0627 \u0627\u0644\u0644\u0645\u0633 \u0623\u0648 \u0627\u0644\u0623\u0633\u0647\u0645/WASD \u2022 \u0632\u0631 \xAB\u062A\u0641\u0627\u0639\u0644\xBB \u0623\u0648 E</div>`;
        T.querySelector("#nm").oninput = (e) => nm = e.target.value;
        T.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => {
          gender = b.dataset.g;
          render();
        });
        T.querySelector("#go").onclick = () => start(nm.trim() || (gender === "f" ? "\u0645\u064A\u0645\u064A" : "\u0631\u064A\u0648"), gender, HAIRS[0]);
      };
      render();
    }
    function start(name, gender, hair) {
      S = { name, gender, hair, day: 0, min: 7 * 60 + 30, money: 120, energy: 90, hunger: 70, mood: 70, know: 0, cook: 0, charm: 10, outfit: "uniform", owned: ["uniform", "casual"], furn: [], pet: null, weather: "clear", gifts: {}, npcs: {}, partner: null, talkedToday: {}, examDone: false, grad: false, workToday: 0 };
      setupNpcs();
      npcs.forEach((n) => S.npcs[n.id] = { aff: 0, met: false });
      P = { x: PLACES.home.dx, y: PLACES.home.dy + 20, dir: 1, walk: 0 };
      $("#title").style.display = "none";
      [".ag-hud", "#goal", "#joy", "#act", "#mb"].forEach((s) => $(s).style.display = s === "#act" || s === "#joy" ? "block" : s === "#mb" ? "flex" : s === ".ag-hud" ? "flex" : "block");
      hud();
      openPanel(`<h3>\u0623\u0647\u0644\u0627\u064B ${esc(name)}! \u{1F338}</h3><p>\u0627\u0644\u0635\u0628\u062D \u0628\u062F\u0631\u064A \u064A\u0648\u0645 ${DAYS[0]}. ${g("\u0623\u0646\u062A", "\u0625\u0646\u062A\u064A")} \u0637\u0627\u0644\u0628${g("", "\u0629")} \u062C\u062F\u064A\u062F${g("", "\u0629")} \u0641\u064A \u0627\u0644\u0645\u062F\u064A\u0646\u0629. \u0631\u0648\u062D \u0627\u0644\u0645\u062F\u0631\u0633\u0629 \u0648\u0644\u0628\u0633 \u0627\u0644\u0632\u064A\u060C \u0630\u0627\u0643\u0631\u060C \u0627\u0634\u062A\u063A\u0644\u060C \u0648\u0627\u062A\u0639\u0631\u0651\u0641 \u0639\u0644\u0649 \u0627\u0644\u0646\u0627\u0633. \u0627\u0644\u0623\u0645\u0627\u0643\u0646 \u0639\u0644\u064A\u0647\u0627 \u062F\u0648\u0627\u064A\u0631 \u0648\u0631\u062F\u064A\u060C \u0642\u0631\u0651\u0628 \u0645\u0646\u0647\u0627 \u0648\u0627\u0636\u063A\u0637 \xAB\u062A\u0641\u0627\u0639\u0644\xBB.</p><button class="ag-opt" data-k="cl" style="text-align:center">\u064A\u0644\u0627 \u0646\u0628\u062F\u0623 \u2728</button>`);
      actMap = { cl: closePanel };
    }
    running = true;
    titleScreen();
    requestAnimationFrame(loop);
    root.__ag = { get S() {
      return S;
    }, get P() {
      return P;
    }, teleport: (k) => {
      const p = PLACES[k];
      P.x = p.dx;
      P.y = p.dy + 8;
    }, get npcs() {
      return npcs;
    }, setTime: (h) => {
      S.min = h * 60;
    } };
    return () => {
      running = false;
      cleanup.forEach((f) => f());
      st.remove();
    };
  }

  // entry.ts
  var r = document.getElementById("r");
  var stop = startGame(r);
  window.R = r;
})();
</script></body></html>
