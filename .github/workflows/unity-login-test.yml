{"name": "Unity login test", "on": "workflow_dispatch", "jobs": {"t": {"runs-on": "ubuntu-latest", "steps": [{"name": "try", "env": {"UE": "${{ secrets.UNITY_EMAIL }}", "UP": "${{ secrets.UNITY_PASSWORD }}"}, "run": "docker run --rm -e UE -e UP unityci/editor:ubuntu-2022.3.45f1-base-3 bash -c 'unity-editor -batchmode -nographics -quit -username \"$UE\" -password \"$UP\" -logfile - 2>&1 | grep -iE \"licens|login|activat|error|serial|entitle\" | head -40; find / -name \"*.ulf\" 2>/dev/null | head' || true"}]}}}
